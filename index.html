<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>বুরো কৃষি বাজার</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Hind Siliguri', 'SolaimanLipi', sans-serif;
      background-color: #ffffff;
    }

    /* ===== MAIN APP (Apps Script) – loads silently behind the loader ===== */
    #app-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
      z-index: 1;
    }

    /* ===== LOADER OVERLAY ===== */
    #bazar-loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      overflow: hidden;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    #bazar-loader-wrapper.hide {
      opacity: 0;
      pointer-events: none;
    }

    .bazar-loader-container {
      text-align: center;
      position: relative;
      width: 320px;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* STEP 1: CART SLIDE FROM RIGHT */
    .cart-stage {
      position: relative;
      width: 90px;
      height: 90px;
      transform: translateX(150vw);
      animation: cartSlideFromRight 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.2s forwards,
                 disappearCart 0.4s ease-in 3.0s forwards;
    }

    .shopping-cart {
      font-size: 75px;
      line-height: 1;
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 10;
      pointer-events: none;
    }

    @keyframes cartSlideFromRight {
      0% { transform: translateX(150vw); }
      100% { transform: translateX(0); }
    }

    /* STEP 2: VEGETABLES FALLING INTO CART */
    .veg-basket-container {
      position: absolute;
      top: -45px;
      left: 4px;
      width: 55px;
      height: 45px;
      z-index: 5;
      pointer-events: none;
    }

    .veg {
      position: absolute;
      font-size: 18px;
      opacity: 0;
    }

    .v1  { left: 2px;  animation: dropVegInside 0.30s ease-in 0.8s forwards; }
    .v2  { left: 14px; animation: dropVegInside 0.30s ease-in 0.95s forwards; }
    .v3  { left: 26px; animation: dropVegInside 0.30s ease-in 1.1s forwards; }
    .v4  { left: 38px; animation: dropVegInside 0.30s ease-in 1.25s forwards; }
    .v5  { left: 8px;  animation: dropVegInside 0.30s ease-in 1.4s forwards; }
    .v6  { left: 20px; animation: dropVegInside 0.30s ease-in 1.55s forwards; }
    .v7  { left: 32px; animation: dropVegInside 0.30s ease-in 1.7s forwards; }
    .v8  { left: 4px;  animation: dropVegInside 0.30s ease-in 1.85s forwards; }
    .v9  { left: 16px; animation: dropVegInside 0.30s ease-in 2.0s forwards; }
    .v10 { left: 28px; animation: dropVegInside 0.30s ease-in 2.15s forwards; }
    .v11 { left: 10px; animation: dropVegInside 0.30s ease-in 2.3s forwards; }
    .v12 { left: 24px; animation: dropVegInside 0.30s ease-in 2.45s forwards; }

    @keyframes dropVegInside {
      0%   { opacity: 0; transform: translateY(-40px) scale(0.5); }
      70%  { opacity: 1; transform: translateY(52px) scale(1.05); }
      100% { opacity: 1; transform: translateY(46px) scale(0.95); }
    }

    /* STEP 3: CART DISAPPEARS */
    @keyframes disappearCart {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.5); }
    }

    /* STEP 4: LOGO ZOOM-IN REVEAL */
    .logo-stage {
      position: absolute;
      opacity: 0;
      transform: scale(0.2);
      animation: zoomLogo 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.27) 3.3s forwards;
    }

    .buro-logo-img {
      height: 95px;
      width: auto;
      object-fit: contain;
      margin-bottom: 12px;
    }

    .brand-title {
      color: #007A3D;
      font-size: 32px;
      font-weight: 700;
      margin: 0;
      white-space: nowrap;
    }

    @keyframes zoomLogo {
      0%   { opacity: 0; transform: scale(0.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Manual link (shown only if the app fails to load) */
    #fallback-link {
      display: none;
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      text-align: center;
      color: #007A3D;
      font-size: 18px;
      font-weight: 700;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- MAIN APP: loads in the background while the animation plays -->
  <iframe id="app-frame"
          title="বুরো কৃষি বাজার"
          src="https://script.google.com/macros/s/AKfycbyHF7uOFvpcrRDk2llAgW0IRwkbRQE3hCMyEPJkXA523z9_4sfLXbu5LB37-6o5HlX8/exec"
          allow="geolocation; camera; microphone; clipboard-write"></iframe>

  <!-- ANIMATED INTRO OVERLAY -->
  <div id="bazar-loader-wrapper">
    <div class="bazar-loader-container">

      <div id="cart-stage" class="cart-stage">
        <div class="veg-basket-container">
          <span class="veg v1">🥬</span>
          <span class="veg v2">🥕</span>
          <span class="veg v3">🥦</span>
          <span class="veg v4">🍆</span>
          <span class="veg v5">🍅</span>
          <span class="veg v6">🌽</span>
          <span class="veg v7">🍌</span>
          <span class="veg v8">🫑</span>
          <span class="veg v9">🥔</span>
          <span class="veg v10">🥒</span>
          <span class="veg v11">🧅</span>
          <span class="veg v12">🧄</span>
        </div>
        <div class="shopping-cart">🛒</div>
      </div>

      <div id="logo-stage" class="logo-stage">
        <img src="https://i.ibb.co/V0Zs3nxN/BURO-Logo-R.png" alt="BURO Logo" class="buro-logo-img">
        <h1 class="brand-title">বুরো কৃষি বাজার</h1>
      </div>

    </div>

    <a id="fallback-link"
       href="https://script.google.com/macros/s/AKfycbyHF7uOFvpcrRDk2llAgW0IRwkbRQE3hCMyEPJkXA523z9_4sfLXbu5LB37-6o5HlX8/exec"
       target="_top">
      সাইট খুলতে এখানে ক্লিক করুন
    </a>
  </div>

  <script>
    var loader = document.getElementById('bazar-loader-wrapper');
    var frame = document.getElementById('app-frame');
    var fallback = document.getElementById('fallback-link');
    var frameLoaded = false;
    var animationDone = false;

    frame.addEventListener('load', function () {
      frameLoaded = true;
      revealIfReady();
    });

    // Animation length (~4.2 seconds)
    setTimeout(function () {
      animationDone = true;
      revealIfReady();
    }, 4200);

    // Hide the loader only when BOTH the animation is finished and the app has loaded
    function revealIfReady() {
      if (animationDone && frameLoaded) {
        loader.classList.add('hide');
        setTimeout(function () { loader.style.display = 'none'; }, 700);
      }
    }

    // If the app is still not loaded after 10 seconds, show a manual link
    setTimeout(function () {
      if (!frameLoaded) { fallback.style.display = 'block'; }
    }, 10000);
  </script>

</body>
</html>
